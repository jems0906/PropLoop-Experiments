name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: Experiment ID to associate with this CI quality snapshot
        required: true
        type: string

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q --junitxml=backend/test-results.xml --cov=backend/app --cov-report=json:backend/coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-quality-evidence
          path: |
            backend/test-results.xml
            backend/coverage.json
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx oxlint --format json > ../backend/lint-results.json
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-evidence
          path: backend/lint-results.json
          if-no-files-found: error
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
  quality-ingest:
    if: github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: backend-quality-evidence
          path: backend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-quality-evidence
          path: backend
      - name: Upload measured quality snapshot
        env:
          QUALITY_INGEST_URL: ${{ secrets.QUALITY_INGEST_URL }}
          QUALITY_INGEST_TOKEN: ${{ secrets.QUALITY_INGEST_TOKEN }}
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
        run: python scripts/post_ci_quality.py
